name: Auction House Alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs)
  workflow_dispatch:          # lets you start it manually from the Actions tab

permissions:
  contents: write             # needed to save seen_listings.json back to the repo

concurrency:
  group: auction-alert        # never run two checks at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check for new listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python new_listings_alert.py --once

      - name: Save seen listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json
          git diff --staged --quiet || (git commit -m "Update seen listings" && git push)
